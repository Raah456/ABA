# Production: `docker compose up -d --build` (see docs/DEPLOY.md).
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env (npm run keygen)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-12}
    volumes:
      - app-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. aba.yourpractice.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Optional off-site copy of the (already encrypted) backups, every hour.
  # Turn on with: docker compose --profile offsite up -d
  offsite-backup:
    image: rclone/rclone:1
    profiles: ["offsite"]
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - app-data:/data:ro
    environment:
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-s3}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-AWS}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${RCLONE_CONFIG_OFFSITE_REGION:-}
      RCLONE_CONFIG_OFFSITE_SERVER_SIDE_ENCRYPTION: ${RCLONE_CONFIG_OFFSITE_SERVER_SIDE_ENCRYPTION:-AES256}
    entrypoint: ["/bin/sh", "-c"]
    # "copy", not "sync": deleting a local backup never deletes the off-site one.
    # Set a lifecycle rule on the bucket to expire old copies instead.
    command:
      - |
        while true; do
          rclone copy /data/backups "$$OFFSITE_REMOTE" --include 'aba-*.db.enc' && echo "$$(date -u) off-site copy OK" || echo "$$(date -u) off-site copy FAILED"
          sleep 3600
        done

volumes:
  app-data:
  caddy-data:
  caddy-config:
